<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로젝트 진행 대시보드</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  .ledger-root {
    --bg-base: #12161C;
    --bg-card: #1B222B;
    --bg-card-hover: #212933;
    --ink: #EDE7D9;
    --ink-muted: #8D9199;
    --seal-gold: #C7A24C;
    --ok-green: #5B9279;
    --warn-amber: #D18B3D;
    --alert-rust: #B0503A;
    --hairline: #2B3440;

    background: var(--bg-base);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    padding: 28px 20px 60px;
    border-radius: 12px;
    max-width: 880px;
    margin: 0 auto;
    box-sizing: border-box;
  }
  .ledger-root * { box-sizing: border-box; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .display { font-family: 'Spectral', serif; }

  /* Header */
  .lr-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 18px;
    margin-bottom: 22px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .lr-header .brand-eyebrow {
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--seal-gold);
    margin: 0 0 6px;
  }
  .lr-header h1 {
    font-family: 'Spectral', serif;
    font-weight: 600;
    font-size: 26px;
    margin: 0;
    color: var(--ink);
  }
  .lr-header .sub {
    color: var(--ink-muted);
    font-size: 13px;
    margin-top: 4px;
  }
  .lr-total {
    text-align: right;
  }
  .lr-total .label {
    font-size: 11px;
    color: var(--ink-muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .lr-total .value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 26px;
    font-weight: 600;
    color: var(--seal-gold);
  }

  /* Today checklist */
  .today-box {
    background: var(--bg-card);
    border-left: 3px solid var(--alert-rust);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 26px;
  }
  .today-box h2 {
    font-family: 'Spectral', serif;
    font-size: 16px;
    margin: 0 0 10px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .today-box h2 .count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    background: var(--alert-rust);
    color: var(--bg-base);
    padding: 1px 7px;
    border-radius: 10px;
  }
  .today-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid var(--hairline);
    font-size: 13.5px;
  }
  .today-item:last-child { border-bottom: none; }
  .today-item input[type=checkbox] {
    margin-top: 2px;
    accent-color: var(--ok-green);
    width: 15px; height: 15px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .today-item.done label { color: var(--ink-muted); text-decoration: line-through; }
  .today-item label { cursor: pointer; }
  .today-item .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--seal-gold);
    margin-right: 4px;
  }
  .today-empty { color: var(--ink-muted); font-size: 13px; }

  /* Ledger rows */
  .lr-section-title {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 30px 0 10px;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 12px;
    transition: background 0.15s ease;
  }
  .card:hover { background: var(--bg-card-hover); }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
  }
  .card-id {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink-muted);
    font-size: 12px;
    margin-right: 8px;
  }
  .card-title {
    font-family: 'Spectral', serif;
    font-size: 16.5px;
    font-weight: 600;
    color: var(--ink);
  }
  .card-amount {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    color: var(--seal-gold);
    white-space: nowrap;
  }
  .seal {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid currentColor;
    border-radius: 999px;
    padding: 3px 12px;
    font-family: 'Spectral', serif;
    font-size: 11px;
    letter-spacing: 0.04em;
    white-space: nowrap;
    margin-top: 6px;
  }
  .seal.ok { color: var(--ok-green); }
  .seal.warn { color: var(--warn-amber); }
  .seal.alert { color: var(--alert-rust); }
  .seal.neutral { color: var(--ink-muted); }

  .card-details {
    list-style: none;
    margin: 12px 0 0;
    padding: 0;
    font-size: 13.5px;
    color: var(--ink-muted);
    line-height: 1.6;
  }
  .card-details li {
    padding-left: 14px;
    position: relative;
  }
  .card-details li::before {
    content: '–';
    position: absolute;
    left: 0;
    color: var(--hairline);
  }
  .card-memo {
    margin-top: 12px;
  }
  .card-memo textarea {
    width: 100%;
    background: var(--bg-base);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 8px 10px;
    resize: vertical;
    min-height: 36px;
  }
  .card-memo textarea::placeholder { color: var(--ink-muted); }
  .memo-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
  }
  .memo-update-btn {
    background: var(--seal-gold);
    color: var(--bg-base);
    border: none;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    padding: 6px 14px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .memo-update-btn:hover { background: #d8b563; }
  .memo-update-btn:active { transform: translateY(1px); }
  .card-memo .saved-flag {
    font-size: 11px;
    color: var(--ok-green);
    height: 14px;
  }

  .footer-note {
    margin-top: 30px;
    font-size: 11.5px;
    color: var(--ink-muted);
    text-align: center;
    border-top: 1px solid var(--hairline);
    padding-top: 14px;
  }

  /* Mobile optimization */
  @media (max-width: 520px) {
    .ledger-root {
      padding: 18px 14px 44px;
      border-radius: 0;
      max-width: 100%;
    }
    .lr-header {
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      padding-bottom: 14px;
      margin-bottom: 18px;
    }
    .lr-header h1 { font-size: 21px; }
    .lr-header .sub { font-size: 12px; }
    .lr-total { text-align: left; width: 100%; }
    .lr-total .value { font-size: 21px; }
    .today-box { padding: 14px 14px; margin-bottom: 20px; }
    .today-box h2 { font-size: 14.5px; }
    .today-item { font-size: 13px; padding: 8px 0; }
    .today-item input[type=checkbox] {
      width: 19px; height: 19px;
    }
    .lr-section-title { margin: 22px 0 8px; }
    .card { padding: 14px 14px; }
    .card-top {
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }
    .card-title { font-size: 15.5px; }
    .card-amount { font-size: 14px; }
    .card-details { font-size: 13px; }
    .seal { font-size: 10.5px; padding: 3px 10px; }
    .card-memo textarea { font-size: 14px; min-height: 44px; }
    .memo-update-btn { padding: 9px 16px; font-size: 13px; }
  }
  @media (max-width: 360px) {
    .lr-header h1 { font-size: 19px; }
    .lr-total .value { font-size: 18px; }
  }

  body { margin: 0; background: #12161C; }
</style>
</head>

  // 이 기기의 localStorage로 자동 전환하여 데이터 유실 없이 계속 동작하도록 함.
  // 저장소 우선순위: Firebase(기기 간 실시간 공유) > window.storage(Claude 아티팩트) > localStorage(이 기기만)
  const fbDb = (typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length)
    ? firebase.database() : null;

  let remoteFailed = false;
  const remote = (typeof window.storage !== 'undefined') ? window.storage : null;
  const local = {
    async get(key, shared){
      try {
        const v = localStorage.getItem((shared ? 'shared:' : 'local:') + key);
        return v !== null ? { key, value: v, shared } : null;
      } catch(e) { return null; }
    },
    async set(key, value, shared){
      try {
        localStorage.setItem((shared ? 'shared:' : 'local:') + key, value);
        return { key, value, shared };
      } catch(e) { return null; }
    }
  };
  const storage = {
    async get(key, shared){
      if (fbDb) {
        try {
          const snap = await fbDb.ref(key).once('value');
          const v = snap.val();
          if (v !== null && v !== undefined) return { key, value: JSON.stringify(v), shared };
          return null;
        } catch(e) { /* Firebase 실패 시 아래 경로로 계속 진행 */ }
      }
      if (remote && !remoteFailed) {
        try { return await remote.get(key, shared); }
        catch(e) {
          const localResult = await local.get(key, shared);
          if (localResult) { remoteFailed = true; return localResult; }
          return null;
        }
      }
      return local.get(key, shared);
    },
    async set(key, value, shared){
      if (fbDb) {
        try {
          await fbDb.ref(key).set(JSON.parse(value));
          return { key, value, shared };

        'Draft v3 상태 — Jaian 법인 정식명칭·등록번호·서명자 정보 미기재'
      ],
      today: '계약서 초안(v3) 검토 및 Jaian 법인정보·서명 확정 필요' }
  ];

  const root = document.getElementById('ledgerRoot');
  const todayStr = new Date().toISOString().slice(0,10);
  document.getElementById('todayDate').textContent = todayStr;

  const totalKnown = projects.reduce((sum,p)=> sum + (p.amount||0), 0);
  const totalUSD = projects.reduce((sum,p)=> sum + (p.amountUSD||0), 0);
  document.getElementById('totalValue').textContent =
    '₩ ' + totalKnown.toLocaleString('ko-KR');
  if (totalUSD > 0) {
    const usdEl = document.createElement('div');
    usdEl.className = 'mono';
    usdEl.style.fontSize = '13px';
    usdEl.style.color = 'var(--ink-muted)';
    usdEl.style.marginTop = '2px';
    usdEl.textContent = '+ USD ' + totalUSD.toLocaleString('en-US') + ' (별도 통화)';
    document.getElementById('totalValue').after(usdEl);
  }

  function fmtAmount(p){
    if (p.amountUSD) return 'USD ' + p.amountUSD.toLocaleString('en-US');
    if (p.amount == null) return '금액 미확정';
    return '₩ ' + p.amount.toLocaleString('ko-KR');
  }

  let checks = {};
  let memos = {};

  async function loadState(){
    try {
      const r = await storage.get('checks:' + todayStr, true);
      checks = r ? JSON.parse(r.value) : {};
    } catch(e) { checks = {}; }
    try {
      const r = await storage.get('memos', true);
      memos = r ? JSON.parse(r.value) : {};
    } catch(e) { memos = {}; }
  }

  async function saveChecks(){
    try { await storage.set('checks:' + todayStr, JSON.stringify(checks), true); }
    catch(e) { console.error('save checks failed', e); }
  }

  let memoTimers = {};
  async function doSaveMemo(id){
    const flag = document.querySelector('.saved-flag[data-id="'+id+'"]');
    if (flag) flag.textContent = '저장 중...';
    try {
      await storage.set('memos', JSON.stringify(memos), true);
      if (flag) { flag.textContent = '✓ 저장됨'; setTimeout(()=>{ if(flag) flag.textContent=''; }, 2000); }
    } catch(e) {
      console.error('save memo failed', e);
      if (flag) { flag.textContent = '저장 실패 — 다시 시도해주세요'; }
    }
  }
  function saveMemo(id, val, immediate){
    memos[id] = val;
    clearTimeout(memoTimers[id]);
    if (immediate) {
      doSaveMemo(id);
    } else {
      memoTimers[id] = setTimeout(() => doSaveMemo(id), 600);
    }
  }

  function renderToday(){
    const list = document.getElementById('todayList');
    const items = projects.filter(p => p.today);
    document.getElementById('todayCount').textContent = items.length;
    if (!items.length) {
      list.innerHTML = '<div class="today-empty">오늘 확인할 항목이 없습니다.</div>';
      return;
    }
    list.innerHTML = items.map(p => {
      const done = !!checks[p.id];
      return '<div class="today-item ' + (done ? 'done' : '') + '">' +
        '<input type="checkbox" id="chk-' + p.id + '" ' + (done ? 'checked' : '') + '>' +
        '<label for="chk-' + p.id + '"><span class="tag">#' + p.id + '</span>' + p.today + '</label>' +
        '</div>';
    }).join('');

    items.forEach(p => {
      const el = document.getElementById('chk-' + p.id);
      el.addEventListener('change', (e) => {
        checks[p.id] = e.target.checked;
        saveChecks();
        renderToday();
      });
    });
  }

  function renderCards(){
    const list = document.getElementById('cardList');
    list.innerHTML = projects.map(p => {
      const memoVal = memos[p.id] || '';
      return '<div class="card">' +
        '<div class="card-top">' +
          '<div>' +
            '<span class="card-id">#' + p.id + '</span>' +
            '<span class="card-title">' + p.title + '</span><br/>' +
            '<span class="seal ' + p.status.tone + '">' + p.status.label + '</span>' +
          '</div>' +
          '<div class="card-amount">' + fmtAmount(p) + '</div>' +
        '</div>' +
        '<ul class="card-details">' + p.details.map(d => '<li>' + d + '</li>').join('') + '</ul>' +
        '<div class="card-memo">' +
          '<textarea placeholder="메모 추가 (파트너와 공유됨)" data-id="' + p.id + '">' + memoVal + '</textarea>' +
          '<div class="memo-row">' +
            '<button class="memo-update-btn" data-id="' + p.id + '">업데이트</button>' +
            '<div class="saved-flag" data-id="' + p.id + '"></div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    list.querySelectorAll('textarea').forEach(t => {
      t.addEventListener('input', (e) => saveMemo(e.target.dataset.id, e.target.value));
    });
    list.querySelectorAll('.memo-update-btn').forEach(b => {
      b.addEventListener('click', (e) => {
        const id = e.target.dataset.id;
        const ta = list.querySelector('textarea[data-id="' + id + '"]');
        saveMemo(id, ta.value, true);
      });
    });
  }

  let cardsRendered = false;

  function applyRemoteChecks(remoteChecks){
    checks = remoteChecks || {};
    renderToday();
  }

  function applyRemoteMemos(remoteMemos){
    memos = remoteMemos || {};
    if (!cardsRendered) {
      renderCards();
      cardsRendered = true;
    } else {
      // 다른 기기에서 온 업데이트로 전체를 다시 그리면 지금 타이핑 중인 내용이 사라질 수 있어서,
      // 지금 포커스가 없는 메모 칸만 최신 값으로 갱신.
      document.querySelectorAll('#cardList textarea').forEach(t => {
        if (document.activeElement !== t) {
          const id = t.dataset.id;
          t.value = memos[id] || '';
        }
      });
    }
  }

  if (fbDb) {
    fbDb.ref('checks:' + todayStr).on('value', snap => applyRemoteChecks(snap.val()));
    fbDb.ref('memos').on('value', snap => applyRemoteMemos(snap.val()));
  } else {
    loadState().then(() => {
      renderToday();
      renderCards();
      cardsRendered = true;
    });
  }
  }
  initLedger();
})();
</script>
</body>
</html>
